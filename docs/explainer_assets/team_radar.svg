<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 118" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="152" height="118" fill="#ffffff"/>
  <text x="76" y="9" text-anchor="middle" font-size="6" font-weight="600" fill="#0f172a">Team Playstyle — Three Extremes</text>
  <text x="76" y="14.5" text-anchor="middle" font-size="3.2" fill="#64748b">five blended style axes (0–1) · further from centre = more of that trait</text>

  <!-- grid pentagons -->
  <g fill="none" stroke="#cbd5e1" stroke-width="0.3">
    <polygon points="76,48.5 85.04,55.07 81.59,65.69 70.42,65.69 66.97,55.07"/>
    <polygon points="76,39 94.07,52.13 87.17,73.37 64.83,73.37 57.93,52.13"/>
    <polygon points="76,29.5 103.11,49.2 92.76,81.06 59.24,81.06 48.89,49.2"/>
    <polygon points="76,20 112.14,46.26 98.34,88.74 53.66,88.74 39.86,46.26" stroke="#94a3b8" stroke-width="0.4"/>
  </g>
  <!-- spokes -->
  <g stroke="#cbd5e1" stroke-width="0.3">
    <line x1="76" y1="58" x2="76" y2="20"/><line x1="76" y1="58" x2="112.14" y2="46.26"/><line x1="76" y1="58" x2="98.34" y2="88.74"/><line x1="76" y1="58" x2="53.66" y2="88.74"/><line x1="76" y1="58" x2="39.86" y2="46.26"/>
  </g>

  <!-- axis labels -->
  <g font-size="3.1" font-weight="600" fill="#334155">
    <text x="76" y="17" text-anchor="middle">Possession</text>
    <text x="114.5" y="46" text-anchor="start">Press</text>
    <text x="100.5" y="93.5" text-anchor="start">Line height</text>
    <text x="51.5" y="93.5" text-anchor="end">Width</text>
    <text x="37.5" y="46" text-anchor="end">Directness</text>
  </g>

  <!-- team polygons -->
  <polygon points="76,26.27 101.08,49.85 95.84,85.30 71.26,64.52 67.98,55.39" fill="#2563eb" fill-opacity="0.13" stroke="#2563eb" stroke-width="0.9"/>
  <polygon points="76,35.96 107.15,47.88 86.17,71.99 67.73,69.38 49.87,49.51" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="0.9"/>
  <polygon points="76,40.60 90.06,53.43 85.52,71.10 56.76,84.47 54.71,51.08" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="0.9"/>
  <!-- vertex dots -->
  <g>
    <circle cx="76" cy="26.27" r="0.9" fill="#2563eb"/><circle cx="101.08" cy="49.85" r="0.9" fill="#2563eb"/><circle cx="95.84" cy="85.30" r="0.9" fill="#2563eb"/><circle cx="71.26" cy="64.52" r="0.9" fill="#2563eb"/><circle cx="67.98" cy="55.39" r="0.9" fill="#2563eb"/>
    <circle cx="76" cy="35.96" r="0.9" fill="#dc2626"/><circle cx="107.15" cy="47.88" r="0.9" fill="#dc2626"/><circle cx="86.17" cy="71.99" r="0.9" fill="#dc2626"/><circle cx="67.73" cy="69.38" r="0.9" fill="#dc2626"/><circle cx="49.87" cy="49.51" r="0.9" fill="#dc2626"/>
    <circle cx="76" cy="40.60" r="0.9" fill="#f59e0b"/><circle cx="90.06" cy="53.43" r="0.9" fill="#f59e0b"/><circle cx="85.52" cy="71.10" r="0.9" fill="#f59e0b"/><circle cx="56.76" cy="84.47" r="0.9" fill="#f59e0b"/><circle cx="54.71" cy="51.08" r="0.9" fill="#f59e0b"/>
  </g>

  <!-- legend -->
  <g font-size="3">
    <rect x="14" y="103" width="3.5" height="3.5" fill="#2563eb" fill-opacity="0.5" stroke="#2563eb" stroke-width="0.5"/><text x="19" y="105.9" fill="#334155"><tspan font-weight="600">Spain</tspan> — tiki-taka: possession, high line, narrow, patient</text>
    <rect x="14" y="108" width="3.5" height="3.5" fill="#dc2626" fill-opacity="0.5" stroke="#dc2626" stroke-width="0.5"/><text x="19" y="110.9" fill="#334155"><tspan font-weight="600">Uruguay</tspan> — direct, high-press, lower block</text>
    <rect x="14" y="113" width="3.5" height="3.5" fill="#f59e0b" fill-opacity="0.5" stroke="#f59e0b" stroke-width="0.5"/><text x="19" y="115.9" fill="#334155"><tspan font-weight="600">Morocco</tspan> — wide, deep, low-possession counter</text>
  </g>
</svg>
