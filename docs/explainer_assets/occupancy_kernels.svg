  <g stroke="#ffffff" stroke-width="0.6" fill="none">
    <rect x="34" y="24" width="52" height="30"/><rect x="92" y="24" width="52" height="30"/><rect x="34" y="62" width="52" height="30"/><rect x="92" y="62" width="52" height="30"/><rect x="34" y="100" width="52" height="30"/><rect x="92" y="100" width="52" height="30"/>
