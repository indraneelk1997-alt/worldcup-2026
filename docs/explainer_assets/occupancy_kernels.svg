<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 172 149" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect x="-10" y="0" width="172" height="149" fill="#ffffff"/>
  <text x="76" y="7.5" text-anchor="middle" font-size="4.8" font-weight="600" fill="#0f172a">Where Three Roles Actually Roam</text>
  <text x="76" y="12.2" text-anchor="middle" font-size="2.7" fill="#64748b">each role's full spread of zones · darker green = more time spent there · to scale, attack →</text>
  <text x="60" y="18" text-anchor="middle" font-size="3.4" font-weight="600" fill="#16a34a">ATTACK phase</text>
  <text x="118" y="18" text-anchor="middle" font-size="3.4" font-weight="600" fill="#2563eb">DEFENCE phase</text>

  <!-- row labels -->
  <g font-size="3" font-weight="600" fill="#0f172a" text-anchor="middle">
    <text x="89" y="22.5">Full-back (LB)</text>
    <text x="89" y="60.5">Box-to-box midfielder (CM)</text>
    <text x="89" y="98.5">Winger (LW)</text>
  </g>

  <!-- grass bases -->
