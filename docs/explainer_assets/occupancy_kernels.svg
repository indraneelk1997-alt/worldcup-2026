  <!-- own-goal / opp-goal hints under bottom row -->
  <text x="35" y="137" font-size="2.4" fill="#94a3b8">own goal</text>
  <text x="143" y="137" text-anchor="end" font-size="2.4" fill="#94a3b8">opp goal →</text>
  <text x="76" y="144" text-anchor="middle" font-size="2.2" fill="#475569">A player's traits shift these maps a little — quicker players push higher, tireless ones roam wider, heavy pressers push the defence up.</text>
</svg>
