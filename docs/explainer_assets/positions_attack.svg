<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 120" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="152" height="120" fill="#ffffff"/>
  <text x="76" y="9" text-anchor="middle" font-size="6" font-weight="600" fill="#0f172a">Where Roles Sit — ATTACK Phase</text>
  <text x="76" y="15.5" text-anchor="middle" font-size="3.3" fill="#64748b">average position when the team HAS the ball · to scale · attack →</text>

  <g><rect x="14" y="20" width="20" height="80" fill="#7cc88a"/><rect x="34" y="20" width="20" height="80" fill="#73c081"/><rect x="54" y="20" width="20" height="80" fill="#7cc88a"/><rect x="74" y="20" width="20" height="80" fill="#73c081"/><rect x="94" y="20" width="20" height="80" fill="#7cc88a"/><rect x="114" y="20" width="20" height="80" fill="#73c081"/></g>
  <g stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.45"><line x1="34" y1="20" x2="34" y2="100"/><line x1="54" y1="20" x2="54" y2="100"/><line x1="74" y1="20" x2="74" y2="100"/><line x1="94" y1="20" x2="94" y2="100"/><line x1="114" y1="20" x2="114" y2="100"/><line x1="14" y1="38" x2="134" y2="38"/><line x1="14" y1="50" x2="134" y2="50"/><line x1="14" y1="70" x2="134" y2="70"/><line x1="14" y1="82" x2="134" y2="82"/></g>
  <g stroke="#ffffff" stroke-width="0.6" fill="none"><rect x="14" y="20" width="120" height="80"/><line x1="74" y1="20" x2="74" y2="100"/><circle cx="74" cy="60" r="9"/><rect x="14" y="38" width="18" height="44"/><rect x="116" y="38" width="18" height="44"/><rect x="14" y="50" width="6" height="20"/><rect x="128" y="50" width="6" height="20"/></g>

  <!-- dots -->
  <g stroke="#ffffff" stroke-width="0.5">
    <circle cx="24" cy="60" r="2.4" fill="#facc15"/>
    <circle cx="51" cy="60" r="2.4" fill="#2563eb"/><circle cx="56" cy="42.5" r="2.4" fill="#2563eb"/><circle cx="56" cy="77.5" r="2.4" fill="#2563eb"/>
    <circle cx="74.8" cy="30" r="2.4" fill="#2563eb"/><circle cx="74.8" cy="90" r="2.4" fill="#2563eb"/><circle cx="80.8" cy="29" r="2.4" fill="#2563eb"/><circle cx="80.8" cy="91" r="2.4" fill="#2563eb"/>
    <circle cx="72.6" cy="60" r="2.4" fill="#f59e0b"/><circle cx="80.6" cy="60" r="2.4" fill="#f59e0b"/>
    <circle cx="76.6" cy="41.6" r="2.4" fill="#f59e0b"/><circle cx="76.6" cy="78.4" r="2.4" fill="#f59e0b"/>
    <circle cx="86" cy="32" r="2.4" fill="#f59e0b"/><circle cx="86" cy="88" r="2.4" fill="#f59e0b"/>
    <circle cx="87.4" cy="60" r="2.4" fill="#f59e0b"/>
    <circle cx="90" cy="38" r="2.4" fill="#f59e0b"/><circle cx="90" cy="82" r="2.4" fill="#f59e0b"/>
    <circle cx="94" cy="33" r="2.4" fill="#dc2626"/><circle cx="94" cy="87" r="2.4" fill="#dc2626"/>
    <circle cx="92.8" cy="60" r="2.4" fill="#dc2626"/>
  </g>

  <!-- central labels (alternating above / below) -->
  <g font-size="2.1" text-anchor="middle" fill="#0f172a">
    <text x="24" y="56.3">GK*</text><text x="51" y="64.7">CB / DF</text>
    <text x="72.6" y="56.3">DM</text><text x="80.6" y="64.7">CM / MF</text><text x="87.4" y="56.3">CAM</text><text x="92.8" y="64.7">ST / FW</text>
  </g>
  <!-- centre-back + central-mid labels, placed to the side -->
  <g font-size="2.1" text-anchor="end" fill="#0f172a">
    <text x="52" y="43.1">LCB</text><text x="52" y="80.1">RCB</text><text x="72.5" y="42.2">LCM</text><text x="72.5" y="79">RCM</text>
  </g>
  <!-- forward roles in the open top / bottom space (no leader lines) -->
  <g font-size="2.1" text-anchor="middle" fill="#0f172a">
    <text x="74.8" y="26.3">LB</text><text x="80.8" y="25.3">LWB</text><text x="86" y="27.8">LM</text><text x="94" y="29.3">LW</text>
    <text x="74.8" y="94.7">RB</text><text x="80.8" y="95.7">RWB</text><text x="86" y="92.4">RM</text><text x="94" y="91.1">RW</text>
  </g>
  <g font-size="2.1" text-anchor="start" fill="#0f172a">
    <text x="93.6" y="38.6">LAM</text><text x="93.6" y="82.6">RAM</text>
  </g>

  <g font-size="2.6" text-anchor="middle" fill="#334155"><text x="24" y="104.5">B1</text><text x="44" y="104.5">B2</text><text x="64" y="104.5">B3</text><text x="84" y="104.5">B4</text><text x="104" y="104.5">B5</text><text x="124" y="104.5">B6</text></g>

  <g font-size="2.7">
    <circle cx="16" cy="110" r="2" fill="#facc15" stroke="#ffffff" stroke-width="0.4"/><text x="19.5" y="111" fill="#334155">GK</text>
    <circle cx="30" cy="110" r="2" fill="#2563eb" stroke="#ffffff" stroke-width="0.4"/><text x="33.5" y="111" fill="#334155">Def</text>
    <circle cx="46" cy="110" r="2" fill="#f59e0b" stroke="#ffffff" stroke-width="0.4"/><text x="49.5" y="111" fill="#334155">Mid</text>
    <circle cx="62" cy="110" r="2" fill="#dc2626" stroke="#ffffff" stroke-width="0.4"/><text x="65.5" y="111" fill="#334155">Fwd</text>
  </g>
  <line x1="92" y1="110" x2="116" y2="110" stroke="#0f172a" stroke-width="0.6"/><path d="M116 110 l-3 -1.5 l0 3 z" fill="#0f172a"/><text x="104" y="108" text-anchor="middle" font-size="2.6" fill="#0f172a">attacking direction</text>
  <text x="14" y="116.5" font-size="2.2" fill="#94a3b8">*GK shown at its own spot (separate goalkeeper model). CB/DF, CM/MF, ST/FW sit in the same place.</text>
</svg>
