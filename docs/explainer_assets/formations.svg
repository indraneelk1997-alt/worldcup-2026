    <text x="28" y="57.22">DM</text><text x="18.73" y="53.5">LCM</text><text x="37.28" y="53.5">RCM</text><text x="15.05" y="47.61">LW</text><text x="28" y="43.16">ST</text><text x="40.95" y="47.61">RW</text>
    <text x="76" y="79.45">GK</text><text x="61.78" y="58.35">LB</text><text x="67.4" y="66.1">LCB</text><text x="84.6" y="66.1">RCB</text><text x="90.23" y="58.35">RB</text>
    <text x="72" y="57.22">DM</text><text x="80" y="57.22">DM</text><text x="65.56" y="46.05">LAM</text><text x="76" y="49.15">CAM</text><text x="86.44" y="46.05">RAM</text><text x="76" y="42.15">ST</text>
