  <!-- legend -->
  <g font-size="2.6">
    <circle cx="38" cy="92" r="1.9" fill="#fde047" stroke="#ca8a04" stroke-width="0.4"/><text x="41.5" y="92.9" fill="#334155">GK</text>
    <circle cx="54" cy="92" r="1.9" fill="#bfdbfe" stroke="#2563eb" stroke-width="0.4"/><text x="57.5" y="92.9" fill="#334155">Def</text>
    <circle cx="72" cy="92" r="1.9" fill="#fde68a" stroke="#d97706" stroke-width="0.4"/><text x="75.5" y="92.9" fill="#334155">Mid</text>
    <circle cx="90" cy="92" r="1.9" fill="#fecaca" stroke="#dc2626" stroke-width="0.4"/><text x="93.5" y="92.9" fill="#334155">Fwd</text>
