    <line x1="56" y1="53" x2="96" y2="53"/><circle cx="76" cy="53" r="4"/>
    <rect x="67" y="22" width="18" height="7"/><rect x="67" y="77" width="18" height="7"/>
    <rect x="104" y="22" width="40" height="62" fill="#7cc88a" stroke="#ffffff"/>
