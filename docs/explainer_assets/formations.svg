    <circle cx="61.78" cy="57.70" r="2.7" fill="#bfdbfe" stroke="#2563eb"/><circle cx="67.4" cy="65.45" r="2.7" fill="#bfdbfe" stroke="#2563eb"/><circle cx="84.6" cy="65.45" r="2.7" fill="#bfdbfe" stroke="#2563eb"/><circle cx="90.23" cy="57.70" r="2.7" fill="#bfdbfe" stroke="#2563eb"/>
    <circle cx="72" cy="56.57" r="2.7" fill="#fde68a" stroke="#d97706"/><circle cx="80" cy="56.57" r="2.7" fill="#fde68a" stroke="#d97706"/><circle cx="65.56" cy="45.40" r="2.7" fill="#fde68a" stroke="#d97706"/><circle cx="76" cy="48.5" r="2.7" fill="#fde68a" stroke="#d97706"/><circle cx="86.44" cy="45.40" r="2.7" fill="#fde68a" stroke="#d97706"/>
