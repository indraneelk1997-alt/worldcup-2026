<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 100" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="152" height="100" fill="#ffffff"/>
  <text x="76" y="8" text-anchor="middle" font-size="5.4" font-weight="600" fill="#0f172a">Three Formations on the Grid</text>
  <text x="76" y="13" text-anchor="middle" font-size="3" fill="#64748b">players at their average (in + out of possession) home position · attack ↑</text>

  <!-- pitch template x3 -->
  <g stroke="#ffffff" stroke-width="0.5" fill="none">
    <rect x="8" y="22" width="40" height="62" fill="#7cc88a" stroke="#ffffff"/>
    <line x1="8" y1="53" x2="48" y2="53"/><circle cx="28" cy="53" r="4"/>
    <rect x="19" y="22" width="18" height="7"/><rect x="19" y="77" width="18" height="7"/>
