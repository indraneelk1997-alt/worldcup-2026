<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 0 182 132" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect x="-15" y="0" width="182" height="132" fill="#ffffff"/>
  <text x="76" y="9" text-anchor="middle" font-size="6" font-weight="600" fill="#0f172a">The Pitch as 30 Zones — Threat Surface (xT)</text>
  <text x="76" y="15.5" text-anchor="middle" font-size="3" fill="#64748b">6 bands (20 long) × 5 lanes (unequal width) · to scale on a 120×80 grass pitch · empirical xT from StatsBomb</text>

  <!-- grass base: alternating mow stripes per band -->
  <g>
    <rect x="14" y="20" width="20" height="80" fill="#7cc88a"/>
    <rect x="34" y="20" width="20" height="80" fill="#73c081"/>
    <rect x="54" y="20" width="20" height="80" fill="#7cc88a"/>
    <rect x="74" y="20" width="20" height="80" fill="#73c081"/>
    <rect x="94" y="20" width="20" height="80" fill="#7cc88a"/>
    <rect x="114" y="20" width="20" height="80" fill="#73c081"/>
  </g>

  <!-- threat overlay: dark green at xT-scaled opacity (capped low so dark text stays readable) -->
  <g fill="#0c3b1e">
    <rect x="14" y="20" width="20" height="18" fill-opacity="0.10"/><rect x="14" y="38" width="20" height="12" fill-opacity="0.10"/><rect x="14" y="50" width="20" height="20" fill-opacity="0.10"/><rect x="14" y="70" width="20" height="12" fill-opacity="0.10"/><rect x="14" y="82" width="20" height="18" fill-opacity="0.10"/>
    <rect x="34" y="20" width="20" height="18" fill-opacity="0.10"/><rect x="34" y="38" width="20" height="12" fill-opacity="0.11"/><rect x="34" y="50" width="20" height="20" fill-opacity="0.11"/><rect x="34" y="70" width="20" height="12" fill-opacity="0.11"/><rect x="34" y="82" width="20" height="18" fill-opacity="0.10"/>
    <rect x="54" y="20" width="20" height="18" fill-opacity="0.11"/><rect x="54" y="38" width="20" height="12" fill-opacity="0.11"/><rect x="54" y="50" width="20" height="20" fill-opacity="0.12"/><rect x="54" y="70" width="20" height="12" fill-opacity="0.11"/><rect x="54" y="82" width="20" height="18" fill-opacity="0.11"/>
    <rect x="74" y="20" width="20" height="18" fill-opacity="0.12"/><rect x="74" y="38" width="20" height="12" fill-opacity="0.12"/><rect x="74" y="50" width="20" height="20" fill-opacity="0.12"/><rect x="74" y="70" width="20" height="12" fill-opacity="0.12"/><rect x="74" y="82" width="20" height="18" fill-opacity="0.12"/>
    <rect x="94" y="20" width="20" height="18" fill-opacity="0.13"/><rect x="94" y="38" width="20" height="12" fill-opacity="0.14"/><rect x="94" y="50" width="20" height="20" fill-opacity="0.15"/><rect x="94" y="70" width="20" height="12" fill-opacity="0.14"/><rect x="94" y="82" width="20" height="18" fill-opacity="0.13"/>
    <rect x="114" y="20" width="20" height="18" fill-opacity="0.14"/><rect x="114" y="38" width="20" height="12" fill-opacity="0.18"/><rect x="114" y="50" width="20" height="20" fill-opacity="0.42"/><rect x="114" y="70" width="20" height="12" fill-opacity="0.18"/><rect x="114" y="82" width="20" height="18" fill-opacity="0.14"/>
  </g>

  <!-- zone grid lines -->
  <g stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.55">
    <line x1="34" y1="20" x2="34" y2="100"/><line x1="54" y1="20" x2="54" y2="100"/><line x1="74" y1="20" x2="74" y2="100"/><line x1="94" y1="20" x2="94" y2="100"/><line x1="114" y1="20" x2="114" y2="100"/>
    <line x1="14" y1="38" x2="134" y2="38"/><line x1="14" y1="50" x2="134" y2="50"/><line x1="14" y1="70" x2="134" y2="70"/><line x1="14" y1="82" x2="134" y2="82"/>
  </g>

  <!-- pitch markings -->
  <g stroke="#ffffff" stroke-width="0.7" fill="none">
    <rect x="14" y="20" width="120" height="80"/>
    <line x1="74" y1="20" x2="74" y2="100"/>
    <circle cx="74" cy="60" r="9"/>
    <rect x="14" y="38" width="18" height="44"/>
    <rect x="116" y="38" width="18" height="44"/>
    <rect x="14" y="50" width="6" height="20"/>
    <rect x="128" y="50" width="6" height="20"/>
  </g>

  <!-- numbers: big = true xT x100 (dark), small = relative index (slate) -->
  <g text-anchor="middle" fill="#0f172a" font-size="3.2">
    <text x="24" y="30">0.35</text><text x="24" y="45">0.44</text><text x="24" y="61">0.46</text><text x="24" y="77">0.44</text><text x="24" y="92">0.35</text>
    <text x="44" y="30">0.51</text><text x="44" y="45">0.60</text><text x="44" y="61">0.62</text><text x="44" y="77">0.60</text><text x="44" y="92">0.51</text>
    <text x="64" y="30">0.71</text><text x="64" y="45">0.81</text><text x="64" y="61">0.84</text><text x="64" y="77">0.81</text><text x="64" y="92">0.71</text>
    <text x="84" y="30">1.04</text><text x="84" y="45">1.16</text><text x="84" y="61">1.17</text><text x="84" y="77">1.16</text><text x="84" y="92">1.04</text>
    <text x="104" y="30">1.58</text><text x="104" y="45">1.94</text><text x="104" y="61">2.24</text><text x="104" y="77">1.94</text><text x="104" y="92">1.58</text>
    <text x="124" y="30">2.15</text><text x="124" y="45">3.43</text><text x="124" y="61">14.3</text><text x="124" y="77">3.43</text><text x="124" y="92">2.15</text>
  </g>
  <g text-anchor="middle" fill="#475569" font-size="2.1">
    <text x="24" y="33.4">2</text><text x="24" y="48.4">3</text><text x="24" y="64.4">3</text><text x="24" y="80.4">3</text><text x="24" y="95.4">2</text>
    <text x="44" y="33.4">4</text><text x="44" y="48.4">4</text><text x="44" y="64.4">4</text><text x="44" y="80.4">4</text><text x="44" y="95.4">4</text>
    <text x="64" y="33.4">5</text><text x="64" y="48.4">6</text><text x="64" y="64.4">6</text><text x="64" y="80.4">6</text><text x="64" y="95.4">5</text>
    <text x="84" y="33.4">7</text><text x="84" y="48.4">8</text><text x="84" y="64.4">8</text><text x="84" y="80.4">8</text><text x="84" y="95.4">7</text>
    <text x="104" y="33.4">11</text><text x="104" y="48.4">14</text><text x="104" y="64.4">16</text><text x="104" y="80.4">14</text><text x="104" y="95.4">11</text>
    <text x="124" y="33.4">15</text><text x="124" y="48.4">24</text><text x="124" y="64.4">100</text><text x="124" y="80.4">24</text><text x="124" y="95.4">15</text>
  </g>

  <!-- lane labels -->
  <g font-size="2.9" text-anchor="end" fill="#334155">
    <text x="12.5" y="30">LW</text><text x="12.5" y="45">L half-sp.</text><text x="12.5" y="61">Central</text><text x="12.5" y="77">R half-sp.</text><text x="12.5" y="92">RW</text>
  </g>

  <!-- band labels -->
  <g font-size="2.7" text-anchor="middle" fill="#334155">
    <text x="24" y="104.5">B1 own box</text><text x="44" y="104.5">B2 build-up</text><text x="64" y="104.5">B3 mid</text><text x="84" y="104.5">B4 opp mid</text><text x="104" y="104.5">B5 approach</text><text x="124" y="104.5">B6 opp box</text>
  </g>

  <!-- attacking arrow with generous label spacing -->
  <g>
    <line x1="54" y1="111" x2="94" y2="111" stroke="#0f172a" stroke-width="0.7"/>
    <path d="M94 111 l-3 -1.6 l0 3.2 z" fill="#0f172a"/>
    <text x="74" y="117" text-anchor="middle" font-size="3" fill="#0f172a">attacking direction</text>
  </g>

  <!-- legend -->
  <g font-size="2.5" fill="#334155">
    <rect x="40" y="119" width="4" height="4" fill="#0c3b1e" fill-opacity="0.42"/>
    <rect x="45" y="119" width="4" height="4" fill="#0c3b1e" fill-opacity="0.10"/>
    <text x="51" y="122.1">darker = more dangerous</text>
    <text x="76" y="127.5" text-anchor="middle">big number = true threat ×100 (xT)   ·   small number = relative index (100 = peak)</text>
  </g>
</svg>
